[package]
name = "rsnetwork-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# A workspace of its own: libFuzzer and its build closure never enter the
# lock file of rsnetwork, and no library depends on this package.
[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
# The QUIC targets need the `tls` feature: the provider of the packet and header protection.
rsnetwork = { path = "..", default-features = false, features = ["tls"] }
# The independent parser of the `differential` target, as in the dev-dependencies of rsnetwork.
httparse = "=1.10.1"

[lints.rust]
warnings = "deny"
# The counting allocator is the one unsafe item, with a reasoned `expect`.
unsafe_code = "deny"

[lints.clippy]
default = { level = "deny", priority = -1 }

[[bin]]
name = "request"
path = "fuzz_targets/request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "response"
path = "fuzz_targets/response.rs"
test = false
doc = false
bench = false

