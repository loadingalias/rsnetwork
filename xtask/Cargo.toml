[package]
name = "xtask"
version = "0.0.0"
description = "Repository commands: cargo xtask fix, check, test, and model."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The SHA-256 of the evidence digest. rscrypto is the family's only source of
# hashes. Like each owned crate, it comes from its Git `main`.
rscrypto = { git = "https://github.com/loadingalias/rscrypto", branch = "main", default-features = false, features = ["sha2"] }

[lints]
workspace = true
