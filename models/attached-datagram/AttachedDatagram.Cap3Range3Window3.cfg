\* The attacker profile with three datagrams allowed in flight by each of the
\* three limits: a receive capacity of three bytes (Cap), a replay window of
\* three packet numbers (Range, which also bounds the spread of the packets
\* in flight), and an initial congestion window of three (Window); every
\* other bound is declared. The smallest of the three limits sets the flight,
\* so Window can bind only when Cap and Range allow three. Window = 3 alone
\* and Cap = 3 with Window = 3 have the states of their base profiles (README,
\* "Evidence record"). This is the raise of Window (family policy, "Design
\* Models", rule 4).
SPECIFICATION Spec
CONSTANTS
    Bytes = 4
    Excess = 1
    MaxPN = 6
    Paths = 2
    Cap = 3
    Range = 3
    Window = 3
    OnPath = TRUE
    FaultySender = FALSE
    Bug = "none"
INVARIANTS
    TypeOK
    CreditBound
    PNStateBound
    HeldAreSenderBytes
    AckMeansHeld
    CompletionSound
    FinalSizeBound
    FinalReadIntegrity
    NoNetworkIntegrity
PROPERTIES
    WindowAfterTag
    OutcomeStable
    Progress
    ValidationEnds
VIEW StateView
