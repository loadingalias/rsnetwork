\* Three bytes and one loss retain reuse below a two-number window.
\* Known-bad: a retransmission reuses its packet number. No on-path attacker,
\* so the failure comes from the reuse.
SPECIFICATION ReuseSpec
CONSTANTS
    Bytes = 3
    Excess = 1
    MaxPN = 4
    Paths = 1
    Cap = 2
    Range = 2
    Window = 1
    OnPath = FALSE
    FaultySender = FALSE
    Bug = "ReusePN"
PROPERTY
    Progress
VIEW StateView
