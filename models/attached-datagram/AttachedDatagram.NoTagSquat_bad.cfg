\* Known-bad: no tag check. The attacker takes a packet number that the sender
\* uses for another offset (the squatting trace), and an acknowledgement then
\* counts an offset that the receiver does not hold.
SPECIFICATION Spec
CONSTANTS
    Bytes = 4
    MaxPN = 6
    Paths = 2
    Cap = 2
    Range = 2
    Window = 2
    OnPath = TRUE
    FaultySender = FALSE
    Bug = "NoTag"
INVARIANT
    AckMeansHeld
